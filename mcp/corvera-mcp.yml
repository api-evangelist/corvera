generated: '2026-07-18'
method: searched
status: published
source: https://docs.corvera.ai/quickstart
server:
  name: corvera
  transport: http
  url: https://mcp.corvera.ai/mcp
  authentication:
    type: oauth2
    flow: authorization_code
    pkce: S256
    dynamic_client_registration: true
    authorization_server: https://mcp.corvera.ai/.well-known/oauth-authorization-server
    scopes: [openid, email, profile, user:org:read]
  notes: >-
    A single hosted HTTP MCP endpoint. On first connect the tool opens a Corvera
    sign-in popup (OAuth). The set of callable tools is gated by the integrations
    the account has connected — connect a new data source and its tools become
    available automatically, with no reconfiguration.
docs_mcp:
  note: >-
    The docs site also advertises a separate public (auth:none) documentation MCP
    for searching the docs, discoverable at
    https://docs.corvera.ai/.well-known/mcp.json (Mintlify-hosted). This is the
    docs-search server, distinct from the product MCP above.
  url: https://corvera.main-kill-isr.mintlify.me/mcp
clients_documented: [Claude Desktop, Claude Code, ChatGPT, Cursor, Lovable, Replit]
