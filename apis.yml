apis:
- name: Corvera MCP Server
  description: >-
    Corvera's hosted Model Context Protocol server. A single OAuth-secured HTTP
    MCP endpoint that exposes governed CPG datasets — retailer, distributor,
    logistics, ERP, warehouse, and ecommerce data — as MCP tools. The tool set
    available to a connection is gated by the integrations the account has
    connected. Authentication is OAuth 2.0 (authorization code + PKCE) with
    dynamic client registration, discoverable via RFC 8414 metadata.
  humanURL: https://docs.corvera.ai
  baseURL: https://mcp.corvera.ai/mcp
